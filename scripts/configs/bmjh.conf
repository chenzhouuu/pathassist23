# =============================================================================
# bmjh.conf  —  Pipeline config for BMJH collection
# =============================================================================

ORG_NAME="bmjh"

# ── Source (NAS on Pramana box) ───────────────────────────────────────────────
SOURCE_DIR="/mnt/clusterNas/dicom_data_bmjh"

# ── S3 ────────────────────────────────────────────────────────────────────────
S3_BUCKET="algopathp-pathssist-health"
S3_PREFIX="bmjh/staging"
AWS_PROFILE="algopath"

# ── EC2 / Girder ──────────────────────────────────────────────────────────────
EC2_HOST="54.224.61.23"
EC2_USER="ubuntu"
EC2_KEY="$HOME/.ssh/ec2_pathassist"
EC2_IMPORT_SCRIPT="/home/ubuntu/scripts/import_wsi_slide.sh"

GIRDER_USER="admin"
GIRDER_PASS="password"

# Girder destination folder + assetstore
# TODO: replace with actual BMJH folder ID once created in Girder
DEST_FOLDER_ID="REPLACE_WITH_BMJH_FOLDER_ID"
ASSETSTORE_ID="69a0ae0ca28f3a7fc0173829"

# ── Local temp dirs ───────────────────────────────────────────────────────────
WORK_DIR="/tmp/wsi_extract"
DIST_DIR="/tmp/wsi_dist"

# ── Logs ──────────────────────────────────────────────────────────────────────
DONE_LOG="/var/log/pathassist_imported_bmjh.log"
LOG_FILE="/var/log/pathassist_pipeline_bmjh.log"
