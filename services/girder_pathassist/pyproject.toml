[project]
name = "girder-pathassist"
version = "0.1.0"
requires-python = ">=3.10"
# Deliberately tiny. This package dispatches and watches; it never loads a model, opens a slide or
# imports torch. `girder` and `girder-worker` are NOT listed: both halves are installed into images
# that already carry them (the DSA image), and depending on them here would make the test suite
# need a Mongo.
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.entry-points."girder.plugin"]
pathassist = "girder_pathassist.girder_plugin:PathAssistPlugin"

[project.entry-points.girder_worker_plugins]
pathassist = "girder_pathassist.girder_worker_plugin:PathAssistWorkerPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/girder_pathassist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
