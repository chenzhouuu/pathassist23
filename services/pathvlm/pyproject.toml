[project]
name = "pathvlm-service"
version = "0.1.0"
requires-python = ">=3.11"
# Flask service hosting the pathology VLMs: the Perceptor (Patho-R1-7B) now, the Navigator (PLIP)
# later. torch/transformers live only in the Dockerfile and are imported lazily behind the
# infer stub seam, so the base env / CI stays GPU-free.
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathvlm_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
