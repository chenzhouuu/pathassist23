# services/pathagent/docker-compose.yml
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  gateway:
    build: .
    ports: ["8000:8000"]
    environment:
      PATHAGENT_REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  worker:
    build: .
    command: uv run rq worker pathagent --url redis://redis:6379/0
    environment:
      PATHAGENT_REDIS_URL: redis://redis:6379/0
    volumes:
      - pathagent-cache:/data/pathagent-cache
    depends_on: [redis]
volumes:
  pathagent-cache:
