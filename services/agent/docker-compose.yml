# services/agent/docker-compose.yml — PathAgent v2 Copilot stack.
# Increment 1: gateway + Postgres control store (conversations + turns persist).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes:
      - copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to inspect the DB from the host (psql -h localhost -p 5433 -U copilot):
    # ports: ["5433:5432"]

  copilot:
    build: .
    ports: ["8010:8010"]
    depends_on:
      db:
        condition: service_healthy
    # Lets the container reach a Girder running on the host via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # MUST match the Girder your viewer is signed into (frontend .env.local
      # VITE_GIRDER_BASE), or tokens issued there are rejected here → 401.
      # Override in services/agent/.env (gitignored).
      AGENT_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      AGENT_CORS_ORIGINS: '["*"]'
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://copilot:copilot@db:5432/copilot}
      # Set AGENT_ANTHROPIC_API_KEY in services/agent/.env to stream real Claude
      # replies; with no key the copilot degrades to the echo responder.
      AGENT_ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY:-}
      AGENT_ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-claude-sonnet-5}
      # The CellViT inference service (R11). Empty ⇒ run_segmentation keeps its canned stub.
      AGENT_CELLVIT_SERVICE_URL: ${AGENT_CELLVIT_SERVICE_URL:-http://cellvit:8020}
      # The pathvlm Perceptor service (Inc 2a). Empty ⇒ describe_region is unavailable.
      AGENT_PATHVLM_SERVICE_URL: ${AGENT_PATHVLM_SERVICE_URL:-http://pathvlm:8021}
      # The preprocess service (Inc 2b). Empty ⇒ find_regions / preprocess routes are unavailable.
      AGENT_PREPROCESS_SERVICE_URL: ${AGENT_PREPROCESS_SERVICE_URL:-http://preprocess:8030}
      # The biomarker service (Inc 3a). Empty ⇒ phenotype_cells is unavailable.
      AGENT_BIOMARKER_SERVICE_URL: ${AGENT_BIOMARKER_SERVICE_URL:-http://biomarker:8022}
      # The dense tissue segmentation service (Inc 4). Empty ⇒ the Tissue panel is unavailable.
      AGENT_TISSUE_SERVICE_URL: ${AGENT_TISSUE_SERVICE_URL:-http://tissue:8023}
      # The Girder plugin that dispatches runs onto Celery (Inc 6 · D5). Empty ⇒ the gateway keeps
      # the pre-Inc-6 path of calling the analysis service directly, so a deployment whose Girder
      # image has not been rebuilt yet still works.
      AGENT_PATHASSIST_PLUGIN_URL: ${AGENT_PATHASSIST_PLUGIN_URL:-}
    volumes:
      - ./src:/app/src        # live code — edit-and-reload during the increment loop
    command: >
      uv run uvicorn agent.gateway.app:create_app --factory
      --host 0.0.0.0 --port 8010 --reload

  # CellViT-SAM-H nuclei segmentation (GPU). Flask service; the gateway reaches it by name.
  cellvit:
    build:
      context: ..
      dockerfile: cellvit/Dockerfile
    ports: ["8020:8020"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # CellViT's ray backend sizes its object store at ~30% of system RAM and wants it on
    # /dev/shm. Docker's default 64 MB — and even 8 GB — is far too small: ray then spills the
    # object store to disk (/tmp/ray), which is slow enough that on a 20x slide (which the x40
    # model must upsample) the segmentation blocks past ray's 60 s GCS-connect timeout and the
    # whole run dies. Size shm to cover ray's RAM-derived target so it stays in memory.
    shm_size: "40gb"
    environment:
      CELLVIT_MODEL: cellvit
      RAY_OBJECT_STORE_ALLOW_SLOW_STORAGE: "1"
      # A 20x slide is upsampled to the x40 model's 0.25 mpp (~4x the pixels), so CellViT's
      # ray postprocessing actors OOM the GPU at the default batch of 8. 2 keeps peak GPU
      # memory in bounds on the shared A6000; raise it if the card is dedicated.
      CELLVIT_BATCH_SIZE: "2"
      # The 20x->40x upsample is a "very slow" arbitrary rescale (no pyramid level exists for
      # upsampling); on a large region it blocks past ray's default 60s GCS-connect deadline,
      # which then tears the run down. Give ray a 300s deadline so slow rescales complete.
      RAY_gcs_rpc_server_reconnect_timeout_s: "300"
      # Same Girder as the gateway — the service reads region pixels with the user's token.
      CELLVIT_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      CELLVIT_CACHE: /weights-cache
      # Where nuclei artifacts are stored (Inc 5). Distinct from CELLVIT_CACHE above, which is
      # the model checkpoint — one is 2.7 GB of weights, the other grows with every slide.
      CELLVIT_ARTIFACT_CACHE: /cache
      CELLVIT_PREPROCESS_CACHE: /pcache
    volumes:
      # Reuse the already-downloaded 2.7 GB SAM-H checkpoint instead of re-downloading.
      - ${CELLVIT_WEIGHTS_DIR:-/home/chen/.cache/cellvit}:/weights-cache
      - cellvit_cache:/cache
      # The preprocess DAG's artifacts, READ-ONLY: a whole-slide run reads this slide's tissue
      # contours to pick the cores worth the GPU, instead of running every core of a slide that
      # is mostly glass.
      - preprocess_cache:/pcache:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # pathvlm Perceptor service (Inc 2a). Flask; the gateway reaches it by name. Runs the REAL
  # MedGemma by default (like cellvit above): the checkpoint is mounted read-only at /weights and
  # a GPU is reserved. restart: unless-stopped brings it back after a host reboot / daemon restart
  # so it never silently drops to the stub. To fall back to the GPU-free stub (no GPU/weights),
  # override PATHVLM_MEDGEMMA_CKPT="" (e.g. in services/agent/.env).
  pathvlm:
    build: ../pathvlm
    ports: ["8021:8021"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same Girder as the gateway — the service reads region pixels with the user's token.
      PATHVLM_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      # Points at the mounted checkpoint ⇒ real MedGemma. Override to "" for the GPU-free stub.
      PATHVLM_MEDGEMMA_CKPT: ${PATHVLM_MEDGEMMA_CKPT:-/weights}
    volumes:
      # Host MedGemma checkpoint dir, mounted read-only. Override PATHVLM_WEIGHTS_DIR to relocate.
      - ${PATHVLM_WEIGHTS_DIR:-/home/chen/data2/models/medgemma-4b-it}:/weights:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # preprocess service (Inc 2b): Trident WSI feature extraction + text→patch region retrieval.
  # Flask; the gateway reaches it by name. Ships the GPU-FREE STUB by default (a deterministic
  # synthetic index) so find_regions is browser-E2E-able with no GPU. Enable the real Trident+CONCH
  # path with PREPROCESS_USE_TRIDENT=1 (needs the GPU image + slide file access — see the Dockerfile).
  preprocess:
    # Long-form so the trident override (docker-compose.trident.yml) can merge in a GPU Dockerfile.
    build:
      context: ..
      dockerfile: preprocess/Dockerfile
    ports: ["8030:8030"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same Girder as the gateway — the resolver reads the slide file doc with the user's token.
      PREPROCESS_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      # GPU-free stub by default; set to 1 to run real Trident+CONCH (GPU image required).
      PREPROCESS_USE_TRIDENT: ${PREPROCESS_USE_TRIDENT:-}
      PREPROCESS_ARTIFACT_CACHE: /cache
      # Local root of original-named slides for the resolver's fast tiers (dev). Matches the host
      # dir mounted below; leave empty in prod (S3) to fall back to the Girder download tier.
      PREPROCESS_SLIDES_ROOT: ${PREPROCESS_SLIDES_ROOT:-/data2}
    volumes:
      - preprocess_cache:/cache
      # Dev slide root (read-only), so the resolver matches .svs locally by name + size instead of
      # downloading. Points at the BRACS demo slides (BRCA-DEMO); override to widen it.
      - ${PREPROCESS_SLIDES_DIR:-/home/chen/data2/BRCA-TEST}:/data2:ro

  # biomarker service (Inc 3a): GigaTIME-Flash virtual biomarkers × CellViT nuclei → per-cell
  # phenotypes. Flask; the gateway reaches it by name; it calls cellvit for nuclei centroids.
  # GPU-FREE base by default: with no weights it returns 503; set BIOMARKER_DEV_STUB=1 for a
  # deterministic dev stub so the phenotype path is browser-E2E-able with no GPU. The real
  # GigaTIME-Flash path is the docker-compose.biomarker.yml override (GPU image + gated weights).
  biomarker:
    # Long-form so the biomarker override can merge in the GPU (Dockerfile.trident) image.
    build:
      context: ..
      dockerfile: biomarker/Dockerfile
    ports: ["8022:8022"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same Girder as the gateway — the service reads region pixels with the user's token.
      BIOMARKER_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      # The CellViT service the fusion fetches nuclei centroids from (service→service).
      BIOMARKER_CELLVIT_URL: ${BIOMARKER_CELLVIT_URL:-http://cellvit:8020}
      # Empty ⇒ 503 without weights; set to 1 for the GPU-free dev stub (browser E2E of the path).
      BIOMARKER_DEV_STUB: ${BIOMARKER_DEV_STUB:-}
      # Inc 3b map job: own artifact cache, the preprocess cache (read-only, for tissue contours),
      # and the local slide root for the fast OpenSlide read tier.
      BIOMARKER_ARTIFACT_CACHE: /cache
      BIOMARKER_PREPROCESS_CACHE: /pcache
      BIOMARKER_SLIDES_ROOT: ${BIOMARKER_SLIDES_ROOT:-/data2}
      # Batch CellViT (D12) — set by docker-compose.batch.yml. Unset ⇒ the job shares the
      # interactive cellvit, which is correct for region jobs (seconds) and wrong for whole-slide.
      BIOMARKER_CELLVIT_BATCH_URL: ${BIOMARKER_CELLVIT_BATCH_URL:-}
    volumes:
      - biomarker_cache:/cache
      # The preprocess DAG's artifacts, READ-ONLY: the job reads a slide's tissue contours from the
      # segmentation stage instead of re-segmenting.
      - preprocess_cache:/pcache:ro
      - ${PREPROCESS_SLIDES_DIR:-/home/chen/data2/BRCA-TEST}:/data2:ro

  # Dense tissue segmentation (Inc 4). Route B: a ResNet50-UNet trained on BCSS, producing a
  # paletted class raster + per-class probability pyramid the viewer mounts like the H&E.
  tissue:
    # Long-form so the tissue override can merge in the GPU (Dockerfile.trident) image.
    build:
      context: ..
      dockerfile: tissue/Dockerfile
    ports: ["8023:8023"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same Girder as the gateway — the service reads region pixels with the user's token.
      TISSUE_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      TISSUE_ARTIFACT_CACHE: /cache
      TISSUE_PREPROCESS_CACHE: /pcache
      TISSUE_SLIDES_ROOT: ${TISSUE_SLIDES_ROOT:-/data2}
      # Stored raster resolution. The service converts this to an integer octave offset against
      # the slide's own mpp, so the tile grid stays aligned; meta.json reports what was used.
      TISSUE_STORE_MPP: ${TISSUE_STORE_MPP:-1.0}
      # Sliding-window overlap in model-input px. 0 unless the measured seam gradient says more.
      TISSUE_OVERLAP: ${TISSUE_OVERLAP:-0}
      # Force a device. Empty ⇒ GPU when it has room, CPU when the shared card is full.
      TISSUE_DEVICE: ${TISSUE_DEVICE:-}
    volumes:
      - tissue_cache:/cache
      # The preprocess DAG's artifacts, READ-ONLY: the job reads a slide's tissue contours from
      # the segmentation stage instead of re-segmenting, and masks everything outside them.
      - preprocess_cache:/pcache:ro
      - ${PREPROCESS_SLIDES_DIR:-/home/chen/data2/BRCA-TEST}:/data2:ro
      # BCSS checkpoint (CC-BY-NC-4.0), read-only.
      - ${TISSUE_WEIGHTS_DIR:-/home/chen/data2/tissue_seg}:/weights/tissue:ro

  # ── The Celery driver for analysis runs (Inc 6 · ticket 01) ─────────────────────────────
  # One per box, holding one job at a time. It computes nothing: it POSTs to the services above
  # and mirrors their progress into a Girder job, so a run survives a browser closing, a gateway
  # restart and a page reload (plan §4).
  #
  # On both networks by necessity. The broker lives in the DSA compose project and its port is
  # deliberately unpublished, so this joins `dsa_default` to reach `rabbitmq` by name rather than
  # exposing a message broker on a host that faces the internet.
  celery:
    build:
      context: ../..
      dockerfile: services/girder_pathassist/Dockerfile
    restart: unless-stopped
    depends_on:
      - preprocess
      - cellvit
      - biomarker
      - tissue
    networks:
      - default
      - dsa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Which box this is. The queue name is the placement decision (Inc 6 · D6).
      PATHASSIST_QUEUE: ${PATHASSIST_QUEUE:-pathassist}
      # Same broker and result backend as dsa-girder-1 and dsa-worker-1 — one Celery cluster, not
      # two. This deployment's rabbitmq does NOT accept the stock guest account, so these carry no
      # usable default: set both in services/agent/.env (gitignored), copying the values out of
      # `docker inspect dsa-girder-1`. An unset broker fails fast at worker start, which is the
      # right failure — a worker silently connected to the wrong broker consumes nothing forever.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in services/agent/.env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in services/agent/.env}
      # Box-local analysis services. A driver never dials across boxes; this is what makes a
      # second GPU machine a copy of this block rather than a scheduler.
      PATHASSIST_PREPROCESS_URL: ${PATHASSIST_PREPROCESS_URL:-http://preprocess:8030}
      PATHASSIST_CELLVIT_URL: ${PATHASSIST_CELLVIT_URL:-http://cellvit:8020}
      PATHASSIST_BIOMARKER_URL: ${PATHASSIST_BIOMARKER_URL:-http://biomarker:8022}
      PATHASSIST_TISSUE_URL: ${PATHASSIST_TISSUE_URL:-http://tissue:8023}
      # Where a terminal outcome is reported, so the artifact row stops being a promise. Read
      # here rather than passed down from the dispatcher: the gateway's address is a property of
      # this box's network, and Girder — on `dsa_default` only — cannot resolve `copilot`.
      PATHASSIST_GATEWAY_URL: ${PATHASSIST_GATEWAY_URL:-http://copilot:8010/api/copilot}
      # How often the driver asks a service where it is. One of the two hops between a tile
      # finishing and the browser hearing about it; the other is the Runs poller.
      PATHASSIST_DRIVER_POLL_SECONDS: ${PATHASSIST_DRIVER_POLL_SECONDS:-1.0}

networks:
  default:
  # The DSA compose project's network, created by `deploy/docker-compose.yml`.
  dsa:
    external: true
    name: ${DSA_NETWORK:-dsa_default}

volumes:
  copilot_pgdata:
  cellvit_cache:
  preprocess_cache:
  biomarker_cache:
  tissue_cache:
