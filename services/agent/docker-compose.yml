# services/agent/docker-compose.yml — PathAgent v2 Copilot stack.
# Increment 1: gateway + Postgres control store (conversations + turns persist).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    volumes:
      - copilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to inspect the DB from the host (psql -h localhost -p 5433 -U copilot):
    # ports: ["5433:5432"]

  copilot:
    build: .
    ports: ["8010:8010"]
    depends_on:
      db:
        condition: service_healthy
    # Lets the container reach a Girder running on the host via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # MUST match the Girder your viewer is signed into (frontend .env.local
      # VITE_GIRDER_BASE), or tokens issued there are rejected here → 401.
      # Override in services/agent/.env (gitignored).
      AGENT_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      AGENT_CORS_ORIGINS: '["*"]'
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://copilot:copilot@db:5432/copilot}
      # Set AGENT_ANTHROPIC_API_KEY in services/agent/.env to stream real Claude
      # replies; with no key the copilot degrades to the echo responder.
      AGENT_ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY:-}
      AGENT_ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-claude-sonnet-5}
      # The CellViT inference service (R11). Empty ⇒ run_segmentation keeps its canned stub.
      AGENT_CELLVIT_SERVICE_URL: ${AGENT_CELLVIT_SERVICE_URL:-http://cellvit:8020}
    volumes:
      - ./src:/app/src        # live code — edit-and-reload during the increment loop
    command: >
      uv run uvicorn agent.gateway.app:create_app --factory
      --host 0.0.0.0 --port 8010 --reload

  # CellViT-SAM-H nuclei segmentation (GPU). Flask service; the gateway reaches it by name.
  cellvit:
    build: ../cellvit
    ports: ["8020:8020"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # CellViT's ray backend sizes its object store from system RAM and wants it on /dev/shm;
    # Docker's default 64 MB shm is far too small. Give it real shm and let ray spill to disk
    # rather than erroring when its (RAM-derived) target still exceeds shm.
    shm_size: "8gb"
    environment:
      CELLVIT_MODEL: cellvit
      RAY_OBJECT_STORE_ALLOW_SLOW_STORAGE: "1"
      # Same Girder as the gateway — the service reads region pixels with the user's token.
      CELLVIT_GIRDER_BASE: ${AGENT_GIRDER_BASE:-http://host.docker.internal:9080/api/v1}
      CELLVIT_CACHE: /weights-cache
    volumes:
      # Reuse the already-downloaded 2.7 GB SAM-H checkpoint instead of re-downloading.
      - ${CELLVIT_WEIGHTS_DIR:-/home/chen/.cache/cellvit}:/weights-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  copilot_pgdata:
