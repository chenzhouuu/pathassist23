[project]
name = "biomarker-service"
version = "0.1.0"
requires-python = ">=3.11"
# Flask (like cellvit/preprocess): the base env stays GPU-free. torch + timm live only in
# Dockerfile.trident and are imported lazily inside the real GigaTIME-Flash path, so
# `BIOMARKER_DEV_STUB` / no-weights runs and CI never import them.
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomarker_service"]

[tool.pytest.ini_options]
pythonpath = ["src", "../_shared"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
