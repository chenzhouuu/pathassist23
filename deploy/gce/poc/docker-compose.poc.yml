---
# docker-compose.poc.yml
# Lightweight POC deployment — single brand, reduced resources
# Usage: docker compose -f docker-compose.poc.yml up -d
#
# Access: http://<VM_IP>/         → PathAssist UI
#         http://<VM_IP>/api/v1/  → Girder API
#         http://<VM_IP>:8081/    → Keycloak admin

services:

  # ── WSI Tile Server ─────────────────────────────────────────────────────────
  girder:
    image: dsarchive/dsa_common_5
    privileged: true
    environment:
      DSA_USER: ${DSA_USER:-}
      DSA_PROVISION_YAML: /opt/digital_slide_archive/devops/dsa/provision.yaml
      DSA_WORKER_CONCURRENCY: 0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq/
      CELERY_RESULT_BACKEND: rpc://guest:guest@rabbitmq/
      GIRDER_MONGO_URI: mongodb://mongodb:27017/girder?socketTimeoutMS=3600000
      GIRDER_SERVER_MODE: production
      GIRDER_SETTING_CORE_CACHE_ENABLED: true
      LARGE_IMAGE_CACHE_BACKEND: memcached
      LARGE_IMAGE_CACHE_TILESOURCE_MAXIMUM: 50
      LARGE_IMAGE_SOURCE_TIFF_CONCURRENCY: 2
      LARGE_IMAGE_SOURCE_PYVIPS_ENABLED: true
      C_FORCE_ROOT: true
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    ports:
      - "8080:8080"
    volumes:
      - ./girder.cfg:/etc/girder.cfg:ro
      - ./assetstore:/assetstore
      - ./provision.py:/opt/digital_slide_archive/devops/dsa/provision.py
      - ./provision.yaml:/opt/digital_slide_archive/devops/dsa/provision.yaml
      - ./start_girder.sh:/opt/digital_slide_archive/devops/dsa/start_girder.sh
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/dsa-cache:/data/large_image_cache
    depends_on:
      - mongodb
      - memcached
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_girder.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/version"]
      interval: 2m
      timeout: 30s
      retries: 5
      start_period: 60s

  # ── Database ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    user: ${DSA_USER:-1000:1000}
    restart: unless-stopped
    command: --maxConns 200 --wiredTigerCacheSizeGB 1
    mem_limit: 2g
    volumes:
      - ./db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Tile Cache ───────────────────────────────────────────────────────────────
  memcached:
    image: memcached
    command: -m 512 --max-item-size 8M
    restart: unless-stopped

  # ── Task Queue ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:latest
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  # ── Background Worker ────────────────────────────────────────────────────────
  worker:
    image: dsarchive/dsa_common_5
    environment:
      DSA_USER: ${DSA_USER:-}
      DSA_WORKER_CONCURRENCY: 2
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq/
      CELERY_RESULT_BACKEND: rpc://guest:guest@rabbitmq/
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 2g
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./start_worker.sh:/opt/digital_slide_archive/devops/dsa/start_worker.sh
      - /tmp:/tmp
      - ./gunicorn:/opt/digital_slide_archive/devops/dsa/utils/gunicorn
    depends_on:
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_worker.sh

  # ── PathAssist UI (single brand for POC) ─────────────────────────────────────
  pathassist-ui:
    image: node:20-alpine
    container_name: pathassist-ui
    working_dir: /app
    restart: unless-stopped
    volumes:
      - /opt/pathassist-poc/dist:/app/dist
    command: sh -c "npx serve dist -p 3000 -s --no-clipboard"

  # ── Keycloak PostgreSQL ───────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-poc_keycloak_db}
    volumes:
      - ./keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Keycloak SSO ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-poc_keycloak_db}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    command: start-dev        # ← start-dev (no SSL required, perfect for POC)
    ports:
      - "8081:8080"           # accessible at http://<IP>:8081
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    mem_limit: 1g

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      - girder
      - keycloak
      - pathassist-ui
    ports:
      - "80:80"
    volumes:
      - ./nginx-poc.conf:/etc/nginx/nginx.conf:ro
