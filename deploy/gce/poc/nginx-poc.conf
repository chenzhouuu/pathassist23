events {}

http {

  proxy_http_version 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 10G;

  # ── Main server — routes by path ──────────────────────────────────────────
  # Access via http://<VM_IP>/
  server {
    listen 80;

    # Girder web UI
    location /girder/ {
      proxy_pass http://girder:8080/;
    }

    # Girder API
    location /api/ {
      proxy_pass http://girder:8080/api/;
    }

    # Girder static assets (HistomicsUI)
    location /static/ {
      proxy_pass http://girder:8080/static/;
    }

    # Keycloak auth
    location /auth/ {
      proxy_pass http://keycloak:8080/;
      proxy_buffer_size       128k;
      proxy_buffers           4 256k;
      proxy_busy_buffers_size 256k;
    }

    # PathAssist UI (React SPA)
    location / {
      proxy_pass http://pathassist-ui:3000;
      # SPA fallback — all routes go to index.html
      proxy_intercept_errors on;
      error_page 404 = @fallback;
    }

    location @fallback {
      proxy_pass http://pathassist-ui:3000;
    }
  }
}
