---
services:
  girder:
    image: dsarchive/dsa_common_5
    build:
      context: ../..
      dockerfile: dsa5.Dockerfile
      # We use this to optionally set version information during the build
      args:
        DSA_VERSIONS: ${DSA_VERSIONS:-}
    # Instead of privileged mode, fuse can use:
    # devices:
    #   - /dev/fuse:/dev/fuse
    # security_opt:
    #   - apparmor:unconfined
    # cap_add:
    #   - SYS_ADMIN
    # but these may be somewhat host specific, so we default to privileged.  If
    # the docker daemon is being run with --no-new-privileges, fuse may not
    # work.
    # See also https://github.com/docker/for-linux/issues/321 for possible
    # methods to avoid both privileged mode and cap_add SYS_ADMIN.
    privileged: true
    # Set DSA_USER to a user id that is part of the docker group (e.g.,
    # `DSA_USER=$(id -u):$(id -g)`).  This makes files in assetstores and logs
    # owned by that user and provides permissions to manage docker
    environment:
      DSA_USER: ${DSA_USER:-}
      DSA_PROVISION_YAML: ${DSA_PROVISION_YAML:-/opt/digital_slide_archive/devops/dsa/provision.yaml}
      DSA_WORKER_CONCURRENCY: 0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq/
      CELERY_RESULT_BACKEND: rpc://guest:guest@rabbitmq/
      GIRDER_MONGO_URI: mongodb://mongodb:27017/girder?socketTimeoutMS=3600000
      GIRDER_SERVER_MODE: production
      GIRDER_SETTING_CORE_CACHE_ENABLED: true
      GIRDER_SETTING_CORE_HTTP_ONLY_COOKIES: true
      GIRDER_SETTING_SERVER_MODE: production
      HISTOMICSUI_RESTRICT_DOWNLOADS: 100000

      # Memcached tile cache — fast, same docker network, 2GB
      LARGE_IMAGE_CACHE_BACKEND: memcached
      # Keep up to 100 tile sources open in memory (file handles + metadata)
      # so re-opening a slide costs nothing
      LARGE_IMAGE_CACHE_TILESOURCE_MAXIMUM: 100
      # Limit concurrent tile decoders per slide — prevents CPU spike with OME-TIFF
      LARGE_IMAGE_SOURCE_TIFF_CONCURRENCY: 4
      # Prefer pyvips for TIFF/OME-TIFF (faster than openslide for pyramid TIFFs)
      LARGE_IMAGE_SOURCE_PYVIPS_ENABLED: true
      LARGE_IMAGE_SOURCE_OPENSLIDE_ENABLED: true

      C_FORCE_ROOT: true
      # FUSE-level diskcache: caches raw S3 file bytes locally (50GB)
      # Critical for pyramid TIFF/SVS/OME-TIFF on S3 — avoids re-fetching
      # file bytes on every tile read after first slide view
      DSA_GIRDER_MOUNT_OPTIONS: "-o diskcache,diskcache_size_limit=53687091200"
      # You can also set girder settings here:
      # GIRDER_SETTING_HISTOMICSUI_LOGIN_SESSION_EXPIRY_MINUTES: 15
      # If you want to authorize docker image repositories on the host machine
      # and have them accessed without further authorization within Girder,
      # you can specify a docker config location, mount it (see volumes,
      # below), and do "docker login <repo>" on the host machine before
      # starting the DSA.
      # DOCKER_CONFIG: /.docker
    restart: unless-stopped
    cpus: 6.0
    mem_limit: 10g

    # Set DSA_PORT to expose the interface on another port (default 8080).
    ports:
      - "${DSA_PORT:-8080}:8080"
    volumes:
      # added as per new cache ..
      - ./girder.cfg:/etc/girder.cfg:ro
      - /mnt/dsa-cache:/data/large_image_cache
      # Needed to use slicer_cli_web to run docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Default assetstore
      - ./assetstore:/assetstore
      # Location of provision.py
      - ./provision.py:/opt/digital_slide_archive/devops/dsa/provision.py
      - ./provision.yaml:/opt/digital_slide_archive/devops/dsa/provision.yaml
      - ./start_girder.sh:/opt/digital_slide_archive/devops/dsa/start_girder.sh
      # Location to store logs
      - ./logs:/logs
    depends_on:
      - mongodb
      - memcached
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_girder.sh
    # logging:
    #   options:
    #     max-size: "10M"
    #     max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/version"]
      interval: 5m
      timeout: 30s
      retries: 5
      start_period: 30s
  mongodb:
    image: "mongo:latest"
    # Set DSA_USER to your user id (e.g., `DSA_USER=$(id -u):$(id -g)`)
    # so that database files are owned by yourself.
    user: ${DSA_USER:-PLEASE SET DSA_USER}
    restart: unless-stopped
    # Limiting maxConns reduces the amount of shared memory demanded by
    # mongo.  Remove this limit or increase the host vm.max_map_count value.
    command: --maxConns 1000 --wiredTigerCacheSizeGB 2
    mem_limit: 3g
    volumes:
      # Location to store database files
      - ./db:/data/db
    # Uncomment to allow access to the database from outside of the docker
    # network.
    # ports:
    #   - "27017"
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
  memcached:
    image: memcached
    command: -m 2048 --max-item-size 8M
    restart: unless-stopped
    # Uncomment to allow access to memcached from outside of the docker network
    # ports:
    #   - "11211"
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/11211; printf "stats\nquit\n" >&3; cat <&3']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
  rabbitmq:
    image: "rabbitmq:latest"
    restart: unless-stopped
    # Uncomment to allow access to rabbitmq from outside of the docker network
    # ports:
    #   - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
    volumes:
      - ./rabbitmq.advanced.config:/etc/rabbitmq/advanced.config:ro
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
  worker:
    image: dsarchive/dsa_common_5
    build:
      context: ../..
      dockerfile: dsa5.Dockerfile
      # We use this to optionally set version information during the build
      args:
        DSA_VERSIONS: ${DSA_VERSIONS:-}
    # Set DSA_USER to a user id that is part of the docker group (e.g.,
    # `DSA_USER=$(id -u):$(id -g)`).  This provides permissions to manage
    # docker
    environment:
      DSA_USER: ${DSA_USER:-}
      DSA_WORKER_CONCURRENCY: ${DSA_WORKER_CONCURRENCY:-4}   # ← change from 1 to 4
      DSA_PROVISION_YAML: ${DSA_PROVISION_YAML:-/opt/digital_slide_archive/devops/dsa/provision.yaml}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq/
      CELERY_RESULT_BACKEND: rpc://guest:guest@rabbitmq/
      TMPDIR:
      # See comments about authorizing docker repositories above
      # DOCKER_CONFIG: /.docker
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    volumes:
      # Needed to use slicer_cli_web to run docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Modify the worker.local.cfg to specify a different rabbitmq server and
      # then enable this mount.  On the rabbitmq server, make sure you add a
      # non-guest default user and use that both in the worker and in the main
      # girder settings.
      # - ./worker.local.cfg:/opt/girder_worker/girder_worker/worker.local.cfg
      # Allow overriding the start command
      - ./start_worker.sh:/opt/digital_slide_archive/devops/dsa/start_worker.sh
      # Needed to allow transferring data to slicer_cli_web docker containers
      - ${TMPDIR:-/tmp}:${TMPDIR:-/tmp}

      # See comments about authorizing docker repositories above
      # - /home/<user directory>/.docker:/.docker:ro

      # Add additional mounts here to get access to existing files on your
      # system if they have the same path as on the girder container.
      - ./gunicorn:/opt/digital_slide_archive/devops/dsa/utils/gunicorn

    depends_on:
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_worker.sh
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: ["CMD", "celery", "-b", "amqp://rabbitmq:5672", "inspect", "ping"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  pathassist-ui:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    volumes:
      - /opt/pathassist23:/app
    command: >
      sh -c "npx serve dist -p 3000 -s --no-clipboard"
    ports:
      - "3000:3000"

  pathassist-mda:
    image: node:20-alpine
    container_name: pathassist-mda
    working_dir: /app
    restart: unless-stopped
    volumes:
      - /opt/pathassist-mda:/app
    command: >
      sh -c "npx serve dist -p 3000 -s --no-clipboard"
    

  pathassist-algopath:
    image: node:20-alpine
    container_name: pathassist-algopath
    working_dir: /app
    restart: unless-stopped
    volumes:
      - /opt/pathassist-algopath:/app
    command: >
      sh -c "npx serve dist -p 3000 -s --no-clipboard"
    

  pathassist-lymphoma:
    image: node:20-alpine
    container_name: pathassist-lymphoma
    working_dir: /app
    restart: unless-stopped
    volumes:
      - /opt/pathassist-lymphoma:/app
    command: >
      sh -c "npx serve dist -p 3000 -s --no-clipboard"
    

  # ── Keycloak PostgreSQL ────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-changeme_keycloak_db}
    volumes:
      - ./keycloak-db:/var/lib/postgresql/data
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Keycloak (SSO / Identity Provider) ────────────────────────────────────
  # Official hardened image: quay.io/keycloak/keycloak
  # Admin console: http://auth.pathassist.health/
  # First boot: run ./deploy/keycloak-setup.sh to configure realm + client
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-changeme_keycloak_db}
      # nginx is the edge proxy — Keycloak runs HTTP internally
      KC_HOSTNAME: auth.pathassist.health
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme_kc_admin}
    command: start
    volumes:
      - ./keycloak-theme/pathassist:/opt/keycloak/themes/pathassist:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    mem_limit: 1g
    logging:
      options:
        max-size: "10M"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-multi-proxy
    restart: unless-stopped
    depends_on:
      - girder
      - keycloak
      - pathassist-mda
      - pathassist-algopath
      - pathassist-lymphoma
    ports:
      - "80:80"
    volumes:
      - ./nginx-multi.conf:/etc/nginx/nginx.conf:ro

