events {}

http {

  proxy_http_version 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 10G;

  # ── Impart DX POC ────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name poc.impart.pathassist.health;
    add_header X-Route-Brand lymphoma always;

    location /girder/ { proxy_pass http://girder:8080/; }
    location /static/  { proxy_pass http://girder:8080/static/; }
    location /api/     { proxy_pass http://girder:8080/api/; }
    location / { proxy_pass http://pathassist-lymphoma:3000; }
  }

  # ── MDA POC ───────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name poc.mda.pathassist.health;
    add_header X-Route-Brand mda always;

    location /girder/ { proxy_pass http://girder:8080/; }
    location /static/  { proxy_pass http://girder:8080/static/; }
    location /api/     { proxy_pass http://girder:8080/api/; }
    location / { proxy_pass http://pathassist-mda:3000; }
  }

  # ── Algopath POC ──────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name poc.algopath.pathassist.health;
    add_header X-Route-Brand algopath always;

    location /girder/ { proxy_pass http://girder:8080/; }
    location /static/  { proxy_pass http://girder:8080/static/; }
    location /api/     { proxy_pass http://girder:8080/api/; }
    location / { proxy_pass http://pathassist-algopath:3000; }
  }

  # ── Auth / Keycloak POC ───────────────────────────────────────────────────────
  server {
    listen 80;
    server_name poc.auth.pathassist.health;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  443;
    }
  }

  # ── Girder Admin (direct) ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name poc.girder.pathassist.health;

    location / { proxy_pass http://girder:8080/; }
  }

}
