events {}

http {

  # ── Upstream: Girder (internal Docker network — never leaves EC2) ────────
  upstream girder_upstream {
    server girder:8080;
  }

  # ── Shared proxy settings ────────────────────────────────────────────────
  proxy_http_version 1.1;
  proxy_set_header   Upgrade           $http_upgrade;
  proxy_set_header   Connection        "upgrade";
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  client_max_body_size 10G;

  # ── MDA (dev) ─────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name mda.dev.pathassist.health;
    add_header X-Route-Brand mda always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-mda:3000;
    }
  }

  # ── MDA (prod) ────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name mda.pathassist.health;
    add_header X-Route-Brand mda always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-mda:3000;
    }
  }

  # ── Algopath (dev) ────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name algopath.dev.pathassist.health;
    add_header X-Route-Brand algopath always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-algopath:3000;
    }
  }

  # ── Algopath (prod) ───────────────────────────────────────────────────────
  server {
    listen 80;
    server_name algopath.pathassist.health;
    add_header X-Route-Brand algopath always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-algopath:3000;
    }
  }

  # ── Lymphoma (dev) ────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name lymphoma.dev.pathassist.health;
    add_header X-Route-Brand lymphoma always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-lymphoma:3000;
    }
  }

  # ── Impart (dev) ─────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name impart.dev.pathassist.health;
    add_header X-Route-Brand lymphoma always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-lymphoma:3000;
    }
  }

  # ── Impart (prod) ────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name impart.pathassist.health;
    add_header X-Route-Brand lymphoma always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-lymphoma:3000;
    }
  }

  # ── Keycloak (auth) ───────────────────────────────────────────────────────
  server {
    listen 80;
    server_name auth.pathassist.health auth.dev.pathassist.health;
    add_header X-Route-Brand keycloak always;

    # Larger buffers needed for Keycloak's token responses
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
      proxy_pass http://keycloak:8080;
    }
  }

  # ── 23.pathassist.health ─────────────────────────────────────────────────
  server {
    listen 80;
    server_name 23.pathassist.health;
    add_header X-Route-Brand lymphoma always;

    location /api/ {
      proxy_pass http://girder_upstream/api/;
    }

    location / {
      proxy_pass http://pathassist-lymphoma:3000;
    }
  }

}
